name: Check and build npm package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run build:npm
      - name: Pack npm package
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - name: Upload npm package
        uses: actions/upload-artifact@v4
        with:
          name: faplex-npm-${{ github.sha }}
          path: ${{ runner.temp }}/faplex-*.tgz
          if-no-files-found: error
