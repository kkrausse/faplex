name: Publish to npm

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: npm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Check whether this version is already published
        id: version
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`);
          if (!response.ok && response.status !== 404) {
            throw new Error(`npm registry returned ${response.status}`);
          }
          console.log(`publish=${response.status === 404}`);
          JS
      - uses: oven-sh/setup-bun@v2
        if: steps.version.outputs.publish == 'true'
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
        if: steps.version.outputs.publish == 'true'
      - run: bun run check
        if: steps.version.outputs.publish == 'true'
      - run: bun test
        if: steps.version.outputs.publish == 'true'
      - name: Publish public package using npm trusted publishing
        if: steps.version.outputs.publish == 'true'
        run: npm publish --access public --provenance
