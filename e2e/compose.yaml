# faplex end-to-end rig: three "machines" that ssh to each other, each with the real Claude Code,
# Codex and OpenCode at pinned versions, all pointed at a fake model API.
#
#   docker compose -f e2e/compose.yaml up -d --build --wait     # build, start, seed
#   e2e/show.sh                                                  # real faplex on `laptop`, list captured with termctrl
#   e2e/faplex.sh                                                # the same faplex in your own terminal
#   e2e/x laptop 'curl -sX POST fakeapi:8080/_control/release'   # let the Working sessions finish (?key=migrate for one)
#   e2e/logs.sh                                                  # seed logs, and which fake API paths were hit or missed
#   e2e/record.sh                                                # fresh rig -> scripted recording -> e2e/out/demo.gif -> teardown
#   docker compose -f e2e/compose.yaml down -v                   # clean up
#
# Seeded state (machine/seed.ts): three sessions, one per machine: one Working, one Needs input, one
# Finished. Which state a prompt leads to is decided by fakeapi/scenarios.ts.
#
# The network is internal: no container can reach a real API or telemetry endpoint. Everything the
# machines need is installed at image build time.
name: faplex-e2e

x-machine: &machine
  image: faplex-e2e-machine
  build:
    context: ..
    dockerfile: e2e/machine/Dockerfile
    # The pinned versions are the Dockerfile's defaults; these override them for a run.
    args:
      CLAUDE_VERSION: ${CLAUDE_VERSION:-2.1.289}
      CODEX_VERSION: ${CODEX_VERSION:-0.160.0}
      OPENCODE_VERSION: ${OPENCODE_VERSION:-2.0.22}
  networks: [rig]
  depends_on:
    fakeapi:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "test", "-f", "/home/dev/.e2e-seeded"]
    interval: 2s
    timeout: 2s
    retries: 90
  stop_grace_period: 2s

services:
  fakeapi:
    build: ./fakeapi
    image: faplex-e2e-fakeapi
    networks: [rig]
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 1s
      timeout: 2s
      retries: 30
    stop_grace_period: 1s

  # The machines seed one after another (each waits for the previous one to be healthy), so the
  # sessions' update times, which order the rows inside a list section, come out the same every run.
  laptop:
    <<: *machine
    hostname: laptop
  devbox:
    <<: *machine
    hostname: devbox
    depends_on:
      laptop:
        condition: service_healthy
  pi:
    <<: *machine
    hostname: pi
    depends_on:
      devbox:
        condition: service_healthy

networks:
  rig:
    internal: true
