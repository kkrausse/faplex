# Codex pointed at the fake API: a custom provider speaking the Responses wire format, with the
# dummy key inline so nothing depends on environment variables (ssh sessions don't carry them).
# A model Codex has metadata for (an unknown one shows a warning badge in its UI); the fake API answers for it.
model = "gpt-6.1-sol"
model_provider = "fake"
check_for_update_on_startup = false
# The container is the sandbox: bubblewrap cannot create namespaces inside an unprivileged container.
sandbox_mode = "danger-full-access"

[model_providers.fake]
name = "Fake"
base_url = "http://fakeapi:8080/v1"
wire_api = "responses"
experimental_bearer_token = "sk-e2e-dummy-key-not-real"
requires_openai_auth = false

[analytics]
enabled = false

[projects."/home/dev/src/shop-api"]
trust_level = "trusted"
[projects."/home/dev/src/infra"]
trust_level = "trusted"
[projects."/home/dev/src/site"]
trust_level = "trusted"
